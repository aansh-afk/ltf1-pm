<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap');

  body {
    width: 1200px;
    height: 630px;
    background: #050505;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Grid background */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(46,46,53,0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,46,53,0.25) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Accent glow */
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
  }
  .glow-1 { top: -200px; right: -100px; background: #6366F1; }
  .glow-2 { bottom: -250px; left: -100px; background: #6366F1; }

  .content {
    position: relative;
    z-index: 10;
    padding: 60px 72px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    color: #F9FAFB;
    letter-spacing: 4px;
    text-transform: uppercase;
    border: 2px solid #2E2E35;
    padding: 8px 16px;
    background: #0A0A0A;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #22C55E;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid #22C55E40;
    padding: 6px 14px;
    background: #22C55E10;
  }

  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }

  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 56px;
    color: #F9FAFB;
    line-height: 1.1;
    letter-spacing: -1px;
    max-width: 800px;
  }

  h1 span {
    color: #6366F1;
  }

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: #9CA3AF;
    line-height: 1.6;
    max-width: 700px;
  }

  .bottom {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #6B7280;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tag .dot {
    width: 6px;
    height: 6px;
    background: #6366F1;
  }

  .divider {
    width: 1px;
    height: 16px;
    background: #2E2E35;
  }

  /* Terminal snippet decoration */
  .terminal {
    position: absolute;
    right: 72px;
    bottom: 100px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: #6B7280;
    border: 2px solid #2E2E35;
    background: #0A0A0A;
    padding: 16px 20px;
    line-height: 1.8;
    min-width: 340px;
  }

  .terminal .prompt { color: #22C55E; }
  .terminal .cmd { color: #F9FAFB; }
  .terminal .flag { color: #6366F1; }
  .terminal .comment { color: #6B7280; }
  .terminal .output { color: #9CA3AF; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="content">
    <div class="top">
      <div class="logo">LTF1</div>
      <div class="badge">Free &amp; Open Source</div>
    </div>

    <div class="middle">
      <h1>Your repo is the<br><span>source of truth.</span></h1>
      <div class="subtitle">
        Tasks update themselves when you push code.<br>
        Git-native project management for developers.
      </div>
    </div>

    <div class="terminal">
      <div><span class="prompt">$</span> <span class="cmd">git push origin</span> <span class="flag">feature/auth</span></div>
      <div><span class="output">  TASK-42 → In Review</span></div>
      <div><span class="output">  Complexity: 3 pts (estimated from diff)</span></div>
    </div>

    <div class="bottom">
      <div class="tag"><div class="dot"></div>Git Integration</div>
      <div class="divider"></div>
      <div class="tag"><div class="dot"></div>CLI + TUI</div>
      <div class="divider"></div>
      <div class="tag"><div class="dot"></div>AI-Powered</div>
      <div class="divider"></div>
      <div class="tag"><div class="dot"></div>Sprint Management</div>
    </div>
  </div>
</body>
</html>
